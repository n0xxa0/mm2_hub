<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MM2 Hub — Trade</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#111118;--surface2:#16161f;--surface3:#1c1c28;
  --border:#232336;--border2:#2a2a40;
  --text:#e8eaf6;--muted:#8888aa;--dimmed:#44445a;
  --red:#e63946;--gold:#ffd166;--cyan:#06d6a0;
  --font:'Rajdhani',sans-serif;--fonthead:'Orbitron',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;min-height:100vh}

/* TOPBAR */
.topbar{background:#0d0d15;border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100}
.tb-logo{font-family:var(--fonthead);font-size:14px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#e63946,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:10px}
.tb-link{background:none;border:none;color:var(--muted);font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:1px;padding:7px 16px;cursor:pointer;border-radius:8px;transition:all .15s}
.tb-link:hover,.tb-link.active{color:var(--text);background:var(--surface3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.data-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(6,214,160,.1);border:1px solid rgba(6,214,160,.3);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--cyan)}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:28px 20px}

/* HEADER */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-family:var(--fonthead);font-size:22px;font-weight:900;letter-spacing:2px}
.page-title span{background:linear-gradient(135deg,#e63946,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-post{padding:11px 24px;background:linear-gradient(135deg,#e63946,#ff6b35);border:none;border-radius:10px;color:#fff;font-family:var(--fonthead);font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(230,57,70,.35)}
.btn-post:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(230,57,70,.5)}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px}
.tab{flex:1;padding:9px;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;border-radius:7px;transition:all .15s;letter-spacing:.5px}
.tab:hover{color:var(--text);background:var(--surface2)}
.tab.active{background:var(--surface3);color:var(--text)}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.filter-input{background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:8px 14px;font-family:var(--font);font-size:14px;outline:none;flex:1;min-width:180px}
.filter-input:focus{border-color:var(--red)}
.filter-input::placeholder{color:var(--dimmed)}
.filter-select{background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:8px 12px;font-family:var(--font);font-size:13px;outline:none;cursor:pointer}

/* ADS GRID */
.ads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* AD CARD */
.ad-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,transform .15s;cursor:pointer}
.ad-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.ad-card.wtb{border-left:3px solid var(--cyan)}
.ad-card.wts{border-left:3px solid var(--gold)}
.ad-card.wtt{border-left:3px solid #c77dff}
.ad-header{padding:12px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.ad-type{font-size:10px;font-weight:900;letter-spacing:2px;padding:3px 8px;border-radius:5px;text-transform:uppercase}
.ad-type.wtb{background:rgba(6,214,160,.15);color:var(--cyan)}
.ad-type.wts{background:rgba(255,209,102,.15);color:var(--gold)}
.ad-type.wtt{background:rgba(199,125,255,.15);color:#c77dff}
.ad-user{font-size:13px;font-weight:700;color:var(--text)}
.ad-time{font-size:11px;color:var(--dimmed);margin-left:auto}
.ad-body{padding:12px 14px}
.ad-section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dimmed);margin-bottom:8px}
.ad-items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ad-item{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;min-width:0}
.ad-item img{width:36px;height:36px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.ad-item-info{min-width:0}
.ad-item-name{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.ad-item-val{font-size:10px;color:var(--gold);font-family:var(--fonthead)}
.ad-item-qty{font-size:10px;color:var(--cyan);font-weight:700}
.ad-arrow{text-align:center;color:var(--dimmed);font-size:18px;margin:4px 0 8px}
.ad-for-label{font-size:12px;color:var(--muted);font-weight:600}
.ad-note{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-style:italic;line-height:1.5}
.ad-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ad-total{font-family:var(--fonthead);font-size:13px;color:var(--gold)}
.ad-contact-btn{margin-left:auto;padding:6px 16px;background:var(--surface3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.ad-contact-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.empty-state{text-align:center;padding:60px 20px;color:var(--dimmed)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-txt{font-size:14px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--fonthead);font-size:15px;font-weight:900;letter-spacing:2px}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.modal-close:hover{color:var(--red);background:rgba(230,57,70,.1)}
.modal-body{padding:20px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:9px 12px;font-family:var(--font);font-size:14px;outline:none}
.form-input:focus{border-color:var(--red)}
.form-input::placeholder{color:var(--dimmed)}
textarea.form-input{resize:vertical;min-height:70px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.type-btns{display:flex;gap:6px}
.type-btn{flex:1;padding:9px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.type-btn:hover{border-color:var(--text);color:var(--text)}
.type-btn.active-wtb{background:rgba(6,214,160,.12);border-color:var(--cyan);color:var(--cyan)}
.type-btn.active-wts{background:rgba(255,209,102,.12);border-color:var(--gold);color:var(--gold)}
.type-btn.active-wtt{background:rgba(199,125,255,.12);border-color:#c77dff;color:#c77dff}
.item-picker{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.item-picker-search{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text);padding:9px 12px;font-family:var(--font);font-size:13px;outline:none}
.item-picker-search::placeholder{color:var(--dimmed)}
.item-picker-list{max-height:160px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px;padding:6px}
.picker-item{padding:6px;border-radius:6px;cursor:pointer;text-align:center;transition:background .12s;border:1px solid transparent}
.picker-item:hover{background:var(--surface3);border-color:var(--border2)}
.picker-item img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 3px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.picker-item-name{font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:36px}
.picked-chip{background:var(--surface3);border:1px solid var(--border2);border-radius:7px;padding:5px 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text)}
.picked-chip img{width:28px;height:28px;object-fit:contain}
.picked-chip-del{color:var(--dimmed);cursor:pointer;font-size:14px;line-height:1;margin-left:2px}
.picked-chip-del:hover{color:var(--red)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{padding:9px 20px;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--red);color:var(--red)}
.btn-submit{padding:9px 24px;background:linear-gradient(135deg,#e63946,#ff6b35);border:none;border-radius:8px;color:#fff;font-family:var(--fonthead);font-size:12px;font-weight:900;letter-spacing:1px;cursor:pointer;transition:all .2s;box-shadow:0 3px 12px rgba(230,57,70,.3)}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(230,57,70,.45)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">MM2 HUB</div>
  <button class="tb-link" onclick="window.location.href='index.html'">📊 Values</button>
  <button class="tb-link active">⚡ Trade</button>
  <div class="tb-right">
    <div class="data-badge">🔄 Trading 24h/24 · 7j/7</div>
  </div>
</div>

<div class="page">
  <div class="page-hdr">
    <div>
      <div class="page-title">Annonces de <span>Trade</span></div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">Postez ce que vous offrez et ce que vous cherchez</div>
    </div>
    <button class="btn-post" onclick="openModal()">+ Poster une annonce</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('all',this)">🔀 Toutes</button>
    <button class="tab" onclick="setTab('wtt',this)">🔁 WTT — J'échange</button>
    <button class="tab" onclick="setTab('wts',this)">💰 WTS — Je vends</button>
    <button class="tab" onclick="setTab('wtb',this)">🛒 WTB — Je cherche</button>
  </div>

  <div class="filter-bar">
    <input class="filter-input" id="searchAds" placeholder="🔍 Rechercher un item..." oninput="renderAds()">
    <select class="filter-select" id="rarityAds" onchange="renderAds()">
      <option value="">Toutes rarités</option>
      <option value="Chroma">Chroma</option>
      <option value="Ancient">Ancient</option>
      <option value="Godly">Godly</option>
      <option value="Legendary">Legendary</option>
      <option value="Rare">Rare</option>
    </select>
  </div>

  <div class="ads-grid" id="adsGrid"></div>
</div>

<!-- MODAL POST -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">POSTER UNE ANNONCE</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Type d'annonce</label>
        <div class="type-btns">
          <button class="type-btn active-wtt" id="tbWTT" onclick="selectType('wtt')">🔁 WTT — J'échange</button>
          <button class="type-btn" id="tbWTS" onclick="selectType('wts')">💰 WTS — Je vends</button>
          <button class="type-btn" id="tbWTB" onclick="selectType('wtb')">🛒 WTB — Je cherche</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Votre pseudo</label>
          <input class="form-input" id="fUsername" placeholder="Ex: n0xxa0" maxlength="24">
        </div>
        <div class="form-group">
          <label class="form-label">Contact (Discord, Roblox…)</label>
          <input class="form-input" id="fContact" placeholder="Ex: n0xxa0#1234">
        </div>
      </div>

      <div class="form-group" id="grpOffer">
        <label class="form-label">Ce que vous offrez</label>
        <div class="item-picker">
          <input class="item-picker-search" id="offerSearch" placeholder="Rechercher un item..." oninput="filterPicker('offer')">
          <div class="item-picker-list" id="offerPickerList"></div>
        </div>
        <div class="picked-items" id="offerPicked"></div>
      </div>

      <div class="form-group" id="grpWant">
        <label class="form-label" id="wantLabel">Ce que vous voulez en échange</label>
        <div class="item-picker">
          <input class="item-picker-search" id="wantSearch" placeholder="Rechercher un item..." oninput="filterPicker('want')">
          <div class="item-picker-list" id="wantPickerList"></div>
        </div>
        <div class="picked-items" id="wantPicked"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Note (optionnel)</label>
        <textarea class="form-input" id="fNote" placeholder="Ex: overpay accepté, items de valeur similaire..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-submit" onclick="submitAd()">✓ PUBLIER</button>
    </div>
  </div>
</div>

  {id:3,type:"wtb",user:"n0xxa0",contact:"n0xxa0#0001",offerItems:[],wantItems:[{name:"Chroma Traveler's Gun",qty:1}],note:"Je paye en Godlies/Ancients",ts:Date.now()-60000*25},
  {id:4,type:"wtt",user:"FrostBlade99",contact:"FrostBlade99#3344",offerItems:[{name:"Icewing",qty:1},{name:"Flames",qty:1}],wantItems:[{name:"Amarok",qty:1}],note:"",ts:Date.now()-3600000*12},
  {id:5,type:"wts",user:"ChromaHunter",contact:"ChromaHunter#7788",offerItems:[{name:"Chroma Bauble",qty:1}],wantItems:[],note:"50K Seers ou équivalent uniquement",ts:Date.now()-60000*8},
];
let nextId = 6;
let currentTab = "all";
let formType = "wtt";
let offerPicked = [];
let wantPicked  = [];

// ── TABS ──
function setTab(t, btn) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderAds();
}

// ── RENDER ADS ──
function renderAds() {
  const q = (document.getElementById("searchAds").value||"").toLowerCase();
  const r = document.getElementById("rarityAds").value;
  const grid = document.getElementById("adsGrid");

  let list = [...ads].reverse().filter(ad => {
    if(currentTab!=="all" && ad.type!==currentTab) return false;
    const allNames = [...ad.offerItems,...ad.wantItems].map(i=>i.name.toLowerCase());
    if(q && !allNames.some(n=>n.includes(q))) return false;
    if(r){
      const allRarities = [...ad.offerItems,...ad.wantItems].map(i=>{
        const found = ALL_ITEMS.find(x=>x.name===i.name);
        return found ? found.rarity : "";
      });
      if(!allRarities.includes(r)) return false;
    }
    return true;
  });

  if(!list.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📋</div><div class="empty-txt">Aucune annonce trouvée.<br><span style="color:var(--red);cursor:pointer;font-weight:700" onclick="openModal()">+ Poster la première !</span></div></div>`;
    return;
  }

  grid.innerHTML = list.map(ad => {
    const typeLabel = {wtt:"WTT — Échange",wts:"WTS — Vente",wtb:"WTB — Recherche"}[ad.type];
    const offerHtml = ad.offerItems.map(it => itemChipHtml(it)).join("");
    const wantHtml  = ad.wantItems.map(it => itemChipHtml(it)).join("");
    const offerVal  = ad.offerItems.reduce((s,it)=>{const f=ALL_ITEMS.find(x=>x.name===it.name);return s+(f?f.value*it.qty:0);},0);
    const wantVal   = ad.wantItems.reduce((s,it)=>{const f=ALL_ITEMS.find(x=>x.name===it.name);return s+(f?f.value*it.qty:0);},0);

    let bodyHtml = "";
    if(ad.type==="wtt"){
      bodyHtml = `<div class="ad-section-label">Offre</div><div class="ad-items">${offerHtml||emptyItems()}</div>
      <div class="ad-arrow">⇄</div>
      <div class="ad-section-label">Veut en échange</div><div class="ad-items">${wantHtml||emptyItems()}</div>`;
    } else if(ad.type==="wts"){
      bodyHtml = `<div class="ad-section-label">Vend</div><div class="ad-items">${offerHtml||emptyItems()}</div>
      <div class="ad-section-label" style="margin-top:8px">Cherche</div><div class="ad-for-label">${ad.note||"Faire une offre"}</div>`;
    } else {
      bodyHtml = `<div class="ad-section-label">Cherche</div><div class="ad-items">${wantHtml||emptyItems()}</div>
      <div class="ad-section-label" style="margin-top:8px">Peut offrir</div><div class="ad-for-label">${ad.note||"Faire une offre"}</div>`;
    }

    return `<div class="ad-card ${ad.type}">
      <div class="ad-header">
        <span class="ad-type ${ad.type}">${typeLabel}</span>
        <span class="ad-user">👤 ${ad.user}</span>
        <span class="ad-time">${timeAgo(ad.ts)}</span>
      </div>
      <div class="ad-body">
        ${bodyHtml}
        ${ad.note && ad.type==="wtt" ? `<div class="ad-note">💬 ${ad.note}</div>` : ""}
      </div>
      <div class="ad-footer">
        <span class="ad-total">📊 ${fmt(offerVal||wantVal)}</span>
        <button class="ad-contact-btn" onclick="contactAd('${ad.user}','${ad.contact}')">💬 Contacter</button>
      </div>
    </div>`;
  }).join("");
}

function itemChipHtml(it) {
  const found = ALL_ITEMS.find(x=>x.name===it.name);
  if(!found) return "";
  const fb = `https://mm2checker.com/images/godlies/${it.name.toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-")}.png`;
  return `<div class="ad-item">
    <img src="${found.img}" onerror="this.src='${fb}';this.onerror=null" alt="${it.name}">
    <div class="ad-item-info">
      <div class="ad-item-name">${it.name}</div>
      <div class="ad-item-val">${fmt(found.value)}${it.qty>1?`<span class="ad-item-qty"> ×${it.qty}</span>`:""}</div>
    </div>
  </div>`;
}

function emptyItems(){return`<span style="font-size:12px;color:var(--dimmed)">—</span>`;}

function contactAd(user, contact) {
  alert(`📬 Contact pour ${user}\n\n${contact}`);
}

// ── MODAL ──
function openModal(){
  document.getElementById("modalOverlay").classList.remove("hidden");
  renderPicker("offer","");
  renderPicker("want","");
  renderPickedChips("offer");
  renderPickedChips("want");
  updateModalLayout();
}
function closeModal(){document.getElementById("modalOverlay").classList.add("hidden");}

function selectType(t){
  formType=t;
  ["wtt","wts","wtb"].forEach(x=>{
    const btn=document.getElementById("tb"+x.toUpperCase());
    btn.className="type-btn"+(t===x?" active-"+x:"");
  });
  updateModalLayout();
}

function updateModalLayout(){
  const grpO=document.getElementById("grpOffer");
  const grpW=document.getElementById("grpWant");
  const lbl=document.getElementById("wantLabel");
  if(formType==="wtt"){grpO.style.display="";grpW.style.display="";lbl.textContent="Ce que vous voulez en échange";}
  else if(formType==="wts"){grpO.style.display="";grpW.style.display="none";}
  else{grpO.style.display="none";grpW.style.display="";lbl.textContent="Ce que vous cherchez";}
}

function renderPicker(side, q){
  const listId=side==="offer"?"offerPickerList":"wantPickerList";
  const items=ALL_ITEMS.filter(i=>!q||i.name.toLowerCase().includes(q.toLowerCase())).slice(0,40);
  document.getElementById(listId).innerHTML=items.map(item=>{
    const fb=`https://mm2checker.com/images/godlies/${item.name.toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-")}.png`;
    const esc=item.name.replace(/'/g,"\\'");
    return`<div class="picker-item" onclick="pickItem('${side}','${esc}')">
      <img src="${item.img}" onerror="this.src='${fb}';this.onerror=null" alt="${item.name}">
      <div class="picker-item-name">${item.name}</div>
    </div>`;
  }).join("");
}

function filterPicker(side){
  const val=document.getElementById(side==="offer"?"offerSearch":"wantSearch").value;
  renderPicker(side,val);
}

function pickItem(side, name){
  const arr=side==="offer"?offerPicked:wantPicked;
  const ex=arr.find(x=>x.name===name);
  if(ex){ex.qty++;}else{arr.push({name,qty:1});}
  renderPickedChips(side);
}

function unpickItem(side, name){
  if(side==="offer") offerPicked=offerPicked.filter(x=>x.name!==name);
  else wantPicked=wantPicked.filter(x=>x.name!==name);
  renderPickedChips(side);
}

function renderPickedChips(side){
  const arr=side==="offer"?offerPicked:wantPicked;
  const el=document.getElementById(side==="offer"?"offerPicked":"wantPicked");
  if(!arr.length){el.innerHTML=`<span style="font-size:12px;color:var(--dimmed)">Cliquez sur un item pour l'ajouter</span>`;return;}
  el.innerHTML=arr.map(it=>{
    const found=ALL_ITEMS.find(x=>x.name===it.name);
    if(!found)return"";
    const fb=`https://mm2checker.com/images/godlies/${it.name.toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-")}.png`;
    const esc=it.name.replace(/'/g,"\\'");
    return`<div class="picked-chip">
      <img src="${found.img}" onerror="this.src='${fb}';this.onerror=null" alt="${it.name}">
      ${it.name}${it.qty>1?` ×${it.qty}`:""}
      <span class="picked-chip-del" onclick="unpickItem('${side}','${esc}')">✕</span>
    </div>`;
  }).join("");
}

function submitAd(){
  const user=document.getElementById("fUsername").value.trim();
  const contact=document.getElementById("fContact").value.trim();
  const note=document.getElementById("fNote").value.trim();
  if(!user){alert("Entrez votre pseudo !");return;}
  if(formType==="wtt"&&(!offerPicked.length||!wantPicked.length)){alert("Ajoutez des items des deux côtés !");return;}
  if(formType==="wts"&&!offerPicked.length){alert("Ajoutez ce que vous vendez !");return;}
  if(formType==="wtb"&&!wantPicked.length){alert("Ajoutez ce que vous cherchez !");return;}

  ads.push({
    id:nextId++,type:formType,user,contact:contact||user,
    offerItems:formType==="wtb"?[]:offerPicked.map(x=>({...x})),
    wantItems:formType==="wts"?[]:wantPicked.map(x=>({...x})),
    note,ts:Date.now()
  });

  // reset
  offerPicked=[];wantPicked=[];
  document.getElementById("fUsername").value="";
  document.getElementById("fContact").value="";
  document.getElementById("fNote").value="";
  closeModal();
  renderAds();
}

renderAds();
</script>
</body>
</html>
