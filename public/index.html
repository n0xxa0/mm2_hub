<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MM2 Hub — Values</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#111118;--surface2:#16161f;--surface3:#1c1c28;
  --border:#232336;--border2:#2a2a40;
  --text:#e8eaf6;--muted:#8888aa;--dimmed:#44445a;
  --red:#e63946;--gold:#ffd166;--cyan:#06d6a0;
  --font:'Rajdhani',sans-serif;--fonthead:'Orbitron',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;min-height:100vh}
.topbar{background:#0d0d15;border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tb-logo{font-family:var(--fonthead);font-size:14px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#e63946,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:10px;white-space:nowrap}
.tb-link{background:none;border:none;color:var(--muted);font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:1px;padding:7px 16px;cursor:pointer;border-radius:8px;transition:all .15s;white-space:nowrap}
.tb-link:hover{color:var(--text);background:var(--surface3)}
.tb-link.active{color:var(--text);background:var(--surface3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.data-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(6,214,160,.1);border:1px solid rgba(6,214,160,.3);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--cyan);white-space:nowrap}
.wrap{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);padding:14px 0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;flex-shrink:0}
.sb-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dimmed);padding:10px 18px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;transition:background .12s;color:var(--muted);font-size:15px;font-weight:600;border-left:3px solid transparent}
.sb-item:hover{background:var(--surface2);color:var(--text)}
.sb-item.active{background:rgba(230,57,70,.1);color:var(--red);border-left-color:var(--red)}
.sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sb-divider{height:1px;background:var(--border);margin:10px 18px}
.sb-count{font-size:11px;color:var(--dimmed);margin-left:auto}
.trade-btn{width:100%;padding:11px 0;background:linear-gradient(135deg,#e63946,#ff6b35);border:none;border-radius:10px;color:#fff;font-family:var(--fonthead);font-size:13px;font-weight:900;letter-spacing:3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(230,57,70,.35)}
.trade-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(230,57,70,.5)}
.main{flex:1;padding:18px 20px;min-width:0}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.filter-input{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 12px;font-family:var(--font);font-size:14px;outline:none;min-width:200px;flex:1}
.filter-input:focus{border-color:var(--red)}
.filter-input::placeholder{color:var(--dimmed)}
.filter-select{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 10px;font-family:var(--font);font-size:12px;outline:none;cursor:pointer}
.filter-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--muted);padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--red);color:var(--red)}
.count-badge{font-size:12px;color:var(--dimmed);margin-left:auto;white-space:nowrap}
.tier-hdr{font-family:var(--fonthead);font-size:18px;font-weight:900;letter-spacing:3px;color:var(--gold);text-align:center;padding:28px 0 16px;text-shadow:0 0 30px rgba(255,209,102,.25)}
.tier-hdr span{display:block;font-size:11px;color:var(--muted);font-family:var(--font);font-weight:400;letter-spacing:2px;margin-top:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:900px){.sidebar{width:200px;min-width:200px}}
@media(max-width:600px){.sidebar{display:none}.main{padding:12px}.grid{grid-template-columns:1fr 1fr}.card-img-box{width:58px;min-width:58px;height:58px}.card-img-box img{width:50px;height:50px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:2px}
.card{background:var(--surface);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;transition:background .12s;cursor:default;position:relative}
.card:hover{background:var(--surface2)}
.card.in-calc{background:rgba(6,214,160,.06);border-left:3px solid var(--cyan)}
.card-img-box{width:90px;min-width:90px;height:90px;background:rgba(0,0,0,.5);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.card-img-box img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));transition:transform .2s}
.card:hover .card-img-box img{transform:scale(1.06)}
.card-info{flex:1;min-width:0}
.card-rarity{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.card-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.card-value{font-family:var(--fonthead);font-size:17px;font-weight:700;color:var(--gold)}
.card-value-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.card-lc{font-size:12px;font-weight:700}
.card-lc.pos{color:#06d6a0}.card-lc.neg{color:#e63946}
.card-range{font-size:11px;color:var(--muted);margin-bottom:5px}
.card-stab{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:6px;letter-spacing:.5px}
.stab-stable{background:rgba(100,100,120,.2);color:#9999bb}
.stab-well{background:rgba(6,214,160,.15);color:#06d6a0}
.stab-overpaid{background:rgba(255,107,53,.15);color:#ff6b35}
.stab-underpaid{background:rgba(100,180,255,.15);color:#64b4ff}
.stab-rising{background:rgba(255,209,102,.15);color:#ffd166}
.stab-dropping{background:rgba(230,57,70,.15);color:#e63946}
.stab-fluctuating{background:rgba(180,130,255,.15);color:#c99fff}
.card-meta{font-size:11px;color:var(--muted);line-height:1.7}
.card-meta b{color:var(--text)}
.card-demand{display:flex;gap:3px;margin-top:6px}
.d-dot{width:8px;height:8px;border-radius:50%;background:var(--border2)}
.d-dot.on{background:var(--gold)}
/* Quantity calc controls */
.calc-controls{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:4px}
.calc-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border2);background:var(--surface3);color:var(--muted);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;padding:0}
.calc-btn.add-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(6,214,160,.1)}
.calc-btn.rem-btn{border-color:rgba(230,57,70,.4);color:var(--red);background:rgba(230,57,70,.1)}
.calc-btn.rem-btn:hover{background:rgba(230,57,70,.25)}
.calc-qty{font-family:var(--fonthead);font-size:13px;font-weight:700;color:var(--cyan);min-width:18px;text-align:center}
/* Inventory panel */
.inv-panel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d0d18;border:1px solid var(--border2);border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:14px;z-index:200;box-shadow:0 4px 32px rgba(0,0,0,.6);min-width:340px;flex-wrap:wrap;justify-content:center}
.inv-panel.hidden{display:none}
.inv-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.inv-value{font-family:var(--fonthead);font-size:20px;font-weight:900;color:var(--gold)}
.inv-count{font-size:11px;color:var(--dimmed)}
.inv-clear{background:none;border:1px solid var(--border2);border-radius:6px;color:var(--muted);padding:4px 12px;font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s}
.inv-clear:hover{border-color:var(--red);color:var(--red)}
.scroll-top{position:fixed;bottom:20px;right:20px;background:var(--surface3);border:1px solid var(--border2);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;color:var(--muted)}
.scroll-top.show{opacity:1}
.scroll-top:hover{color:var(--text)}
.data-info{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:11px;color:var(--dimmed);margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:900px){.sidebar{display:none}.main{padding:12px}}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.card-img-box{width:58px;min-width:58px;height:58px}.card-img-box img{width:50px;height:50px}.topbar{padding:0 10px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">MM2 HUB</div>
  <button class="tb-link active">📊 Values</button>
  <button class="tb-link" onclick="window.location.href='trade.html'">⚡ Trade</button>
  <div class="tb-right">
    <div class="data-badge">⚡ MM2 HUB</div>
  </div>
</div>

<div class="wrap">
  <aside class="sidebar">
    <div class="sb-title">Rarity</div>
    <div class="sb-item active" data-r="all" onclick="setRarity('all',null,this)"><span class="sb-dot" style="background:#666"></span>All Items<span class="sb-count" id="cnt-all"></span></div>

    <div class="sb-item" data-r="Ancient"   onclick="setRarity('Ancient',null,this)"><span class="sb-dot" style="background:#c77dff"></span>Ancients<span class="sb-count" id="cnt-Ancient"></span></div>
    <div class="sb-item" data-r="Godly"     onclick="setRarity('Godly',null,this)"><span class="sb-dot" style="background:#e74c3c"></span>Godlies<span class="sb-count" id="cnt-Godly"></span></div>
    <div class="sb-item" data-r="Vintage"   onclick="setRarity('Vintage',null,this)"><span class="sb-dot" style="background:#c8a882"></span>Vintages<span class="sb-count" id="cnt-Vintage"></span></div>
    <div class="sb-item" data-r="Legendary" onclick="setRarity('Legendary',null,this)"><span class="sb-dot" style="background:#f1c40f"></span>Legendaries<span class="sb-count" id="cnt-Legendary"></span></div>
    <div class="sb-item" data-r="Rare"      onclick="setRarity('Rare',null,this)"><span class="sb-dot" style="background:#2980b9"></span>Rares<span class="sb-count" id="cnt-Rare"></span></div>
    <div class="sb-item" data-r="Uncommon"  onclick="setRarity('Uncommon',null,this)"><span class="sb-dot" style="background:#5dade2"></span>Uncommons<span class="sb-count" id="cnt-Uncommon"></span></div>
    <div class="sb-item" data-r="Common"    onclick="setRarity('Common',null,this)"><span class="sb-dot" style="background:#95a5a6"></span>Commons<span class="sb-count" id="cnt-Common"></span></div>
    <div class="sb-item" data-r="Unique"    onclick="setRarity('Unique',null,this)"><span class="sb-dot" style="background:#e0e0e0"></span>Uniques<span class="sb-count" id="cnt-Unique"></span></div>
    <div class="sb-item" data-r="Pet"       onclick="setRarity('Pet',null,this)"><span class="sb-dot" style="background:#ff9ff3"></span>Pets<span class="sb-count" id="cnt-Pet"></span></div>
    <div class="sb-item" data-r="Set"       onclick="setRarity('Set',null,this)"><span class="sb-dot" style="background:#54a0ff"></span>Sets<span class="sb-count" id="cnt-Set"></span></div>
    <div class="sb-item" data-r="Misc"      onclick="setRarity('Misc',null,this)"><span class="sb-dot" style="background:#576574"></span>Misc<span class="sb-count" id="cnt-Misc"></span></div>
    <div class="sb-divider"></div>
    <div class="sb-title">Type</div>
    <div class="sb-item active" data-type="all" onclick="setType('all',this)">⚔️ All Types</div>
    <div class="sb-item" data-type="K"          onclick="setType('K',this)">🔪 Knives</div>
    <div class="sb-item" data-type="G"          onclick="setType('G',this)">🔫 Guns</div>
    <div class="sb-divider"></div>
    <div class="sb-title">Sort By</div>
    <div class="sb-item active" data-sort="value"  onclick="setSort('value',this)">📊 Value ↓</div>
    <div class="sb-item" data-sort="name"           onclick="setSort('name',this)">🔤 Name A→Z</div>
    <div class="sb-item" data-sort="demand"         onclick="setSort('demand',this)">📈 Demand ↓</div>
    <div class="sb-divider"></div>
    <div style="padding:10px 14px">
      <button class="trade-btn" onclick="window.open('trade.html','_blank')">⚡ TRADE</button>
    </div>
  </aside>

  <main class="main">
    <div class="filter-bar">
      <input class="filter-input" id="searchInput" placeholder="🔍 Search item name..." oninput="render()">
      <select class="filter-select" id="eventSel" onchange="render()">
        <option value="">All Events</option>
      </select>
      <select class="filter-select" id="yearSel" onchange="render()">
        <option value="">All Years</option>
        <option>2015</option><option>2016</option><option>2017</option><option>2018</option>
        <option>2019</option><option>2020</option><option>2021</option><option>2022</option>
        <option>2023</option><option>2024</option><option>2025</option><option>2026</option>
      </select>
      <select class="filter-select" id="stabSel" onchange="render()">
        <option value="">All Stability</option>
        <option>Stable</option><option>Doing Well</option><option>Overpaid For</option>
        <option>Underpaid For</option><option>Fluctuating</option>
      </select>
      <button class="filter-btn" onclick="clearFilters()">✕ Clear</button>
      <span class="count-badge" id="countLbl">—</span>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</div>

<div class="inv-panel hidden" id="invPanel">
  <div>
    <div class="inv-label">Your Inventory Value</div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="inv-value" id="invTotal">0</span>
      <span class="inv-count" id="invCount"></span>
    </div>
  </div>
  <button class="inv-clear" onclick="clearCalc()">✕ Clear</button>
</div>

// ─── EXTRACT EVENTS ───────────────────────────────────────────
const EVENT_KEYWORDS = [
  {key:"Xmas",      label:"🎄 Christmas"},
  {key:"Hallows",   label:"🎃 Hallows"},
  {key:"Valentine", label:"💝 Valentine"},
  {key:"Easter",    label:"🐣 Easter"},
  {key:"Summer",    label:"☀️ Summer"},
  {key:"Halloween", label:"🎃 Halloween"},
];

function populateEventFilter() {
  const sel = document.getElementById("eventSel");
  EVENT_KEYWORDS.forEach(ev => {
    const exists = ALL_ITEMS.some(i => (i.origin||"").includes(ev.key));
    if (exists) {
      const opt = document.createElement("option");
      opt.value = ev.key;
      opt.textContent = ev.label;
      sel.appendChild(opt);
    }
  });
}

// ─── RENDER ───────────────────────────────────────────────────
function render() {
  const q     = (document.getElementById("searchInput").value || "").toLowerCase();
  const year  = document.getElementById("yearSel").value;
  const stab  = document.getElementById("stabSel").value;
  const event = document.getElementById("eventSel").value;

  let data = ALL_ITEMS.filter(item => {
    if (currentRarity !== "all" && item.rarity !== currentRarity) return false;
    if (currentType   !== "all" && item.t      !== currentType)   return false;
    if (q     && !item.name.toLowerCase().includes(q))            return false;
    if (year  && !(item.origin||"").includes(year))               return false;
    if (stab  && item.stab !== stab)                              return false;
    if (event && !(item.origin||"").includes(event))              return false;
    return true;
  });

  if (currentSort === "value")       data.sort((a,b) => b.value - a.value);
  else if (currentSort === "name")   data.sort((a,b) => a.name.localeCompare(b.name));
  else if (currentSort === "demand") data.sort((a,b) => b.demand - a.demand);

  document.getElementById("countLbl").textContent = data.length + " items";

  const tiers = [
    {label:"Tier 3", sub:"1,000+ Seers",  items: data.filter(i => i.value >= 1000)},
    {label:"Tier 2", sub:"50 – 999 Seers",items: data.filter(i => i.value >= 50 && i.value < 1000)},
    {label:"Tier 1", sub:"5 – 49 Seers",  items: data.filter(i => i.value >= 5  && i.value < 50)},
    {label:"Tier 0", sub:"< 5 Seers",     items: data.filter(i => i.value < 5)},
  ];

  let html = "";
  tiers.forEach(tier => {
    if (!tier.items.length) return;
    html += `<div class="tier-hdr">${tier.label}<span>${tier.sub} · ${tier.items.length} items</span></div>`;
    html += `<div class="grid">` + tier.items.map(cardHtml).join("") + `</div>`;
  });

  if (!html) html = `<div style="text-align:center;padding:60px;color:var(--dimmed)">No items found.</div>`;
  document.getElementById("content").innerHTML = html;
}

// ─── INVENTORY CALC ───────────────────────────────────────────
let calcItems = {}; // key: item name → {value, qty}

function addToCalc(name, value) {
  if (!calcItems[name]) calcItems[name] = {value, qty: 0};
  calcItems[name].qty++;
  refreshCardControls(name);
  updateInvPanel();
}

function removeFromCalc(name) {
  if (!calcItems[name]) return;
  calcItems[name].qty--;
  if (calcItems[name].qty <= 0) delete calcItems[name];
  refreshCardControls(name);
  updateInvPanel();
}

function refreshCardControls(name) {
  // Update all cards with this name (only 1 in DOM at a time, but safe)
  document.querySelectorAll(`.card[data-name="${CSS.escape(name)}"]`).forEach(card => {
    const qty = calcItems[name] ? calcItems[name].qty : 0;
    const qtyEl = card.querySelector(".calc-qty");
    const remBtn = card.querySelector(".rem-btn");
    if (qtyEl) qtyEl.textContent = qty > 0 ? "×"+qty : "";
    if (remBtn) remBtn.style.display = qty > 0 ? "flex" : "none";
    card.classList.toggle("in-calc", qty > 0);
  });
}

function updateInvPanel() {
  const keys = Object.keys(calcItems);
  const totalQty = keys.reduce((s,k) => s + calcItems[k].qty, 0);
  const total = keys.reduce((s,k) => s + calcItems[k].value * calcItems[k].qty, 0);
  document.getElementById("invTotal").textContent = total.toLocaleString();
  document.getElementById("invCount").textContent = totalQty > 0 ? `[${totalQty} item${totalQty>1?"s":""}]` : "";
  document.getElementById("invPanel").classList.toggle("hidden", keys.length === 0);
}

function clearCalc() {
  calcItems = {};
  document.querySelectorAll(".card").forEach(card => {
    card.classList.remove("in-calc");
    const qtyEl = card.querySelector(".calc-qty");
    const remBtn = card.querySelector(".rem-btn");
    if (qtyEl) qtyEl.textContent = "";
    if (remBtn) remBtn.style.display = "none";
  });
  updateInvPanel();
}

function cardHtml(item) {
  const rc   = RC[item.rarity] || {color:"#888"};
  const s    = STAB[item.stab] || STAB["Stable"];
  const lcCls= item.lc > 0 ? "pos" : item.lc < 0 ? "neg" : "";
  const lcTxt= item.lc > 0 ? `(+${item.lc})` : item.lc < 0 ? `(${item.lc})` : "";
  let dots = "";
  for (let i=1; i<=10; i++) dots += `<div class="d-dot${i<=item.demand?" on":""}"></div>`;
  const rangeHtml = item.range
    ? `<div class="card-range">Range — [${item.range[0].toLocaleString()} - ${item.range[1].toLocaleString()}]</div>`
    : `<div class="card-range">Range — [N/A]</div>`;
  const imgFb = `https://mm2checker.com/images/godlies/${(item.name||"").toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-")}.png`;
  const qty = calcItems[item.name] ? calcItems[item.name].qty : 0;
  const esc = item.name.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  return `
  <div class="card${qty>0?" in-calc":""}" data-name="${item.name.replace(/"/g,'&quot;')}">
    <div class="calc-controls">
      <button class="calc-btn rem-btn" style="display:${qty>0?"flex":"none"}" onclick="removeFromCalc('${esc}')" title="Retirer un">−</button>
      <span class="calc-qty">${qty>0?"×"+qty:""}</span>
      <button class="calc-btn add-btn" onclick="addToCalc('${esc}',${item.value})" title="Ajouter au calcul">+</button>
    </div>
    <div class="card-img-box">
      <img src="${item.img}" onerror="this.src='${imgFb}';this.onerror=null" loading="lazy" alt="${item.name}">
    </div>
    <div class="card-info">
      <div class="card-rarity" style="color:${rc.color}">${item.rarity}</div>
      <div class="card-name" title="${item.name}">${item.name}</div>
      <div class="card-value-row">
        <span class="card-value">Value — ${item.value.toLocaleString()}</span>
        ${lcTxt ? `<span class="card-lc ${lcCls}">${lcTxt}</span>` : ""}
      </div>
      ${rangeHtml}
      <div><span class="card-stab ${s.cls}">${item.stab} ${s.arrow}</span></div>
      <div class="card-meta">Demand — <b>${item.demand}</b> &nbsp;·&nbsp; Origin — <b>${item.origin||"N/A"}</b></div>
      <div class="card-demand" title="Demand: ${item.demand}/10">${dots}</div>
    </div>
  </div>`;
}

function updateCounts() {
  document.getElementById("cnt-all").textContent = ALL_ITEMS.length;
  ["Chroma","Ancient","Godly","Vintage","Legendary","Rare","Uncommon","Common","Unique","Pet","Set","Misc"].forEach(r => {
    const el = document.getElementById("cnt-"+r);
    if (el) el.textContent = ALL_ITEMS.filter(i => i.rarity === r).length;
  });
}

function setRarity(r, topBtn, sbItem) {
  currentRarity = r;
  document.querySelectorAll(".sidebar .sb-item[data-r]").forEach(b => b.classList.toggle("active", b.dataset.r === r));
  render();
}
function setType(t) {
  currentType = t;
  document.querySelectorAll(".sidebar .sb-item[data-type]").forEach(b => b.classList.toggle("active", b.dataset.type === t));
  render();
}
function setSort(s) {
  currentSort = s;
  document.querySelectorAll(".sidebar .sb-item[data-sort]").forEach(b => b.classList.toggle("active", b.dataset.sort === s));
  render();
}
function clearFilters() {
  document.getElementById("searchInput").value = "";
  document.getElementById("yearSel").value = "";
  document.getElementById("stabSel").value = "";
  document.getElementById("eventSel").value = "";
  render();
}

window.addEventListener("scroll", () => {
  document.getElementById("scrollTop").classList.toggle("show", window.scrollY > 400);
});

updateCounts();
populateEventFilter();
render();
</script>
